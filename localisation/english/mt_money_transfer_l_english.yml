l_english:
 # --- Diplomatic action list entries ---
 # Convention: the game auto-looks-up <ACTION_ID>_TITLE for the button label and
 # <ACTION_ID>_ACTION_DESC for the list-row tooltip; send_description is a separate explicit
 # field pointing at whatever key you like (used for the compose-popup description).
 MT_MONEY_TRANSFER_TITLE: "Transfer Funds"
 MT_MONEY_TRANSFER_ACTION_DESC: "Send a one-time amount of treasury to this country."
 MT_SUBSIDIES_TITLE: "Offer Subsidies"
 MT_SUBSIDIES_ACTION_DESC: "Offer to pay this country a standing weekly subsidy out of our own treasury."
 MT_SUBSIDIES_ADJUST_TITLE: "Adjust Subsidy"
 MT_SUBSIDIES_ADJUST_ACTION_DESC: "Renegotiate the weekly amount we pay this country in subsidies."
 MT_SUBSIDIES_CANCEL_INCOMING_TITLE: "Reject Subsidies (Incoming)"
 MT_SUBSIDIES_CANCEL_INCOMING_ACTION_DESC: "Reject the standing subsidy this country pays to us."
 MT_BOND_PURCHASE_TITLE: "Purchase Sovereign Bond"
 MT_BOND_PURCHASE_ACTION_DESC: "Lend this country treasury against a bond, to be repaid with interest at face value."
 MT_BOND_BUYBACK_TITLE: "Buy Back Bond"
 MT_BOND_BUYBACK_ACTION_DESC: "Repurchase our own debt from this creditor at face value."
 MT_BOND_SELL_TITLE: "Sell Bond to Market"
 MT_BOND_SELL_ACTION_DESC: "Sell our claim on this country's debt to the secondary market for immediate cash."

 # --- Economy view income/expense breakdown ---
 mt_subsidies_income_tt: "$$[?total_subsidies_in|+3] from §YSubsidies§!\n"
 mt_subsidies_expense_tt: "$$[?total_subsidies_out|-3] from §YSubsidies§!\n"

 MT_MONEYTOOL_COOLDOWN: "§RWe have used a money-transfer tool too recently and must wait before using another.§!"
 MT_MONEYTOOL_READY: "We are free to use a money-transfer tool."

 # --- Fund Transfer ---
 MT_MONEY_TRANSFER_SEND_DESC: "Choose an amount of treasury to send."
 MT_MONEY_TRANSFER_ACCEPT_TITLE: "Funds Received"
 MT_MONEY_TRANSFER_ACCEPT_DESC: "[THIS.GetNameWithFlag] has accepted the transfer."
 MT_MONEY_TRANSFER_REJECT_TITLE: "Funds Refused"
 MT_MONEY_TRANSFER_REJECT_DESC: "[THIS.GetNameWithFlag] has refused the transfer."
 MT_MONEY_TRANSFER_TITLE_WINDOW: "Transfer Funds"
 MT_MONEY_TRANSFER_DESC: "Choose how much to send. Click for 1, Ctrl-click for 10, Shift-click for 100, Alt-click for 1000."
 MT_MONEY_TRANSFER_AMOUNT: "[?ROOT.gift_size]"
 money_transfer_plus_tt: "Increase the amount sent."
 money_transfer_minus_tt: "Decrease the amount sent."

 # --- Weekly Subsidies ---
 MT_SUBSIDIES_SEND_DESC: "Offer to pay this country a standing weekly subsidy out of our own treasury."
 MT_SUBSIDIES_ACCEPT_TITLE: "Subsidies Accepted"
 MT_SUBSIDIES_ACCEPT_DESC: "[THIS.GetNameWithFlag] has agreed to accept our subsidies."
 MT_SUBSIDIES_REJECT_TITLE: "Subsidies Refused"
 MT_SUBSIDIES_REJECT_DESC: "[THIS.GetNameWithFlag] has refused our subsidies."
 MT_SUBSIDIES_TITLE_WINDOW: "Offer Subsidies"
 MT_SUBSIDIES_DESC: "Choose a weekly amount to pay this country for as long as the subsidy stands. Click for 0.01, Ctrl-click for 0.1, Shift-click for 1, Alt-click for 10."
 MT_SUBSIDIES_AMOUNT: "[?ROOT.subsidies_size]"
 subsidies_plus_tt: "Increase the weekly subsidy."
 subsidies_minus_tt: "Decrease the weekly subsidy."
 MT_SUBSIDIES_CANCEL_INCOMING_SEND_DESC: "Reject the standing subsidy this country pays to us."

 MT_SUBSIDIES_ADJUST_SEND_DESC: "Choose a new weekly amount to pay this country, replacing the current subsidy."
 MT_SUBSIDIES_ADJUST_ACCEPT_TITLE: "Subsidy Adjusted"
 MT_SUBSIDIES_ADJUST_ACCEPT_DESC: "[THIS.GetNameWithFlag] has agreed to the new subsidy amount."
 MT_SUBSIDIES_ADJUST_REJECT_TITLE: "Adjustment Refused"
 MT_SUBSIDIES_ADJUST_REJECT_DESC: "[THIS.GetNameWithFlag] has refused the new subsidy amount. The old amount remains in effect."

 # --- Bond Trading ---
 MT_BOND_PURCHASE_SEND_DESC: "Lend this country treasury against a bond, to be repaid with interest."
 MT_BOND_PURCHASE_ACCEPT_TITLE: "Bond Issued"
 MT_BOND_PURCHASE_ACCEPT_DESC: "[THIS.GetNameWithFlag] has agreed to issue the bond."
 MT_BOND_PURCHASE_REJECT_TITLE: "Bond Refused"
 MT_BOND_PURCHASE_REJECT_DESC: "[THIS.GetNameWithFlag] has refused to issue the bond."
 MT_BOND_PURCHASE_TITLE_WINDOW: "Purchase Sovereign Bond"
 MT_BOND_PURCHASE_DESC: "Choose the principal to lend."
 MT_BOND_PURCHASE_DESC_2: "The debtor will owe back the principal plus interest at face value."
 MT_BOND_PURCHASE_DESC_3: "Click for 1, Ctrl-click for 10, Shift-click for 100, Alt-click for 1000."
 MT_BOND_PURCHASE_AMOUNT: "[?ROOT.bond_size]"
 bond_purchase_plus_tt: "Increase the principal."
 bond_purchase_minus_tt: "Decrease the principal."
 MT_BOND_INTEREST_AMOUNT: "[?ROOT.bond_interest]%"
 bond_interest_plus_tt: "Increase the interest rate."
 bond_interest_minus_tt: "Decrease the interest rate."
 MT_BOND_BUYBACK_SEND_DESC: "Repurchase our own debt from this creditor at face value."
 MT_BOND_BUYBACK_ACCEPT_TITLE: "Bond Bought Back"
 MT_BOND_BUYBACK_ACCEPT_DESC: "[THIS.GetNameWithFlag] has agreed to sell the bond back."
 MT_BOND_BUYBACK_REJECT_TITLE: "Buyback Refused"
 MT_BOND_BUYBACK_REJECT_DESC: "[THIS.GetNameWithFlag] has refused to sell the bond back."
 MT_BOND_BUYBACK_TITLE_WINDOW: "Buy Back Bond"
 MT_BOND_BUYBACK_DESC: "Choose how much of the debt owed to this creditor to repurchase at face value."
 MT_BOND_BUYBACK_DESC_2: "Click for 1, Ctrl-click for 10, Shift-click for 100, Alt-click for 1000."
 MT_BOND_BUYBACK_AMOUNT: "[?ROOT.bond_buyback_size]"
 bond_buyback_plus_tt: "Increase the buyback amount."
 bond_buyback_minus_tt: "Decrease the buyback amount."
 MT_BOND_SELL_SEND_DESC: "Sell our claim on this country's debt to the secondary market."
 MT_BOND_SELL_TITLE_WINDOW: "Sell Bond to Market"
 MT_BOND_SELL_DESC: "Choose how much of the bond we hold against this country to sell."
 MT_BOND_SELL_DESC_2: "We receive only half the face value in cash, and the full face value becomes real debt for them."
 MT_BOND_SELL_DESC_3: "Click for 1, Ctrl-click for 10, Shift-click for 100, Alt-click for 1000."
 MT_BOND_SELL_AMOUNT: "[?ROOT.bond_sell_size]"
 bond_sell_plus_tt: "Increase the amount to sell."
 bond_sell_minus_tt: "Decrease the amount to sell."

 # --- Subsidies Management Tab ---
 mt_subsidies_decisions: "Subsidies"
 d_mt_cancel_outgoing_subsidy: "Cancel a Subsidy We Pay"
 d_mt_cancel_outgoing_subsidy_desc: "Select one of the countries we currently pay a weekly subsidy to and stop paying them. We are currently paying out §R[?total_subsidies_out]§! per week in total."
 d_mt_cancel_incoming_subsidy: "Reject a Subsidy We Receive"
 d_mt_cancel_incoming_subsidy_desc: "Select one of the countries currently paying us a weekly subsidy and reject it. We are currently receiving §G[?total_subsidies_in]§! per week in total."
 d_mt_cancel_all_outgoing_subsidies: "Cancel All Outgoing Subsidies"
 d_mt_cancel_all_outgoing_subsidies_desc: "Immediately cancel every weekly subsidy we currently pay to other countries, all at once. We are currently paying out §R[?total_subsidies_out]§! per week in total."
 d_mt_cancel_all_incoming_subsidies: "Reject All Incoming Subsidies"
 d_mt_cancel_all_incoming_subsidies_desc: "Immediately reject every weekly subsidy currently being paid to us by other countries, all at once. We are currently receiving §G[?total_subsidies_in]§! per week in total."

 # --- GM Tools ---
 mt_gc_tools_decisions: "Game Master Tools"
 mt_gc_nation: "Game Master"
 mt_gc_nation_desc: "This nation is run by the roleplay's Game Master and has access to special administrative tools."
 d_mt_gm_bond_crisis: "Trigger Sovereign Debt Crisis"
 d_mt_gm_bond_crisis_desc: "Select a country to plunge into a sovereign debt crisis. This can only be used once per game."

 # --- Bond Crisis ---
 mt_bond_crisis_decisions: "Bond Crisis Response"
 mt_bond_crisis: "Sovereign Debt Crisis"
 mt_bond_crisis_desc: "Bond markets have lost confidence in our government's ability to service its debt. Borrowing costs are climbing and the economy is straining under the pressure."
 mt_currency_devaluation: "Currency Devaluation"
 mt_currency_devaluation_desc: "Our currency is losing value as investors flee to safer assets."
 mt_currency_devaluation_min: "Mild Currency Devaluation"
 mt_currency_devaluation_min_desc: "Our currency is under mild pressure as the crisis unfolds."
 mt_global_recession_bonds: "Recession"
 mt_global_recession_bonds_desc: "The debt crisis has tipped the economy into a severe recession."
 mt_global_recession_bonds_min: "Mild Recession"
 mt_global_recession_bonds_min_desc: "The debt crisis has slowed the economy."
 mt_global_recession_bonds_minmin: "Economic Slowdown"
 mt_global_recession_bonds_minmin_desc: "The debt crisis has caused a mild economic slowdown."
 mt_reduced_oil_demand: "Reduced Oil Demand"
 mt_reduced_oil_demand_desc: "The economic slowdown has reduced demand for our oil exports."

 d_mt_bond_crisis_1: "Emergency Measures"
 d_mt_bond_crisis_1_desc: "We can quietly redirect crisis-response funds through political channels. It will pad the treasury and buy us political capital, at the cost of worsening corruption."
 d_mt_bond_crisis_2: "Cut Interest Rates"
 d_mt_bond_crisis_2_desc: "Easing monetary policy will lower our borrowing costs and shorten the crisis, but it will cost us political capital."
 d_mt_bond_crisis_3: "Emergency Bailout"
 d_mt_bond_crisis_3_desc: "A bailout package will shorten the crisis, at the cost of a significant one-time hit to the treasury."
 d_mt_bond_crisis_4: "Industrial Support Package"
 d_mt_bond_crisis_4_desc: "Propping up struggling industry will keep factories running, but will slow new construction."
 d_mt_bond_crisis_5: "Capital Controls"
 d_mt_bond_crisis_5_desc: "Restricting the flow of capital in and out of the country will stabilize markets, but will slow investment and dampen returns."

 # --- Bond Crisis Event Chain ---
 mt_bond_crisis.1.t: "Bond Markets in Turmoil"
 mt_bond_crisis.1.d: "Confidence in [ROOT.GetNameDef]'s ability to service its debt has collapsed. Bond yields are spiking as investors dump [ROOT.GetAdjective] government debt."
 mt_bond_crisis.1.o1: "This is a crisis."

 mt_bond_crisis.2.t: "Currency Under Pressure"
 mt_bond_crisis.2.d: "As bond yields climb, capital is fleeing [ROOT.GetNameDef] for safer assets, putting sustained downward pressure on our currency."
 mt_bond_crisis.2.o1: "We'll manage."

 mt_bond_crisis.3.t: "Economic Fallout"
 mt_bond_crisis.3.d: "The debt crisis is spreading into the wider economy. Investment is drying up and growth is slowing."
 mt_bond_crisis.3.o1: "A severe recession looms."
 mt_bond_crisis.3.o2: "A recession is setting in."
 mt_bond_crisis.3.o3: "We can weather this."

 mt_bond_crisis.4.t: "Demand Slumps"
 mt_bond_crisis.4.d: "The slowdown has reduced global appetite for [ROOT.GetAdjective] exports, oil included."
 mt_bond_crisis.4.o1: "Understood."
 mt_bond_crisis.4.o2: "This hurts our export revenue."

 mt_bond_crisis.5.t: "Crisis Resolved"
 mt_bond_crisis.5.d: "Markets have stabilized. Bond yields are falling and confidence in our government's finances is returning."
 mt_bond_crisis.5.o1: "A relief."

 mt_bond_crisis_tt: "The severity of this recession is tied to how indebted we already are relative to our economy."
