 national_ideas: "National Ideas"
 economic_ideas: "Economic Ideas"
 military_ideas: "Military Ideas"
 national_ideas_1: "Our Society"
 national_ideas_2: "Our Economy"
 national_ideas_3: "Our Military"
 #national ideas 1
 ni_3: "Natality Initiative"
 ni_3_desc: "State efforts have ensured that the population feels comfortable in life and therefore have more children. While expensive on the state, the increased population rates supports future economic growth."
 ni_19: "One Child Policy"
 ni_19_desc: "Strict laws in our country end unp regulate family growth to ensure sustainability within our economy, though this can come with severe problems down the line."
 ni_20: "Apartheid State"
 ni_20_desc: "The state enforces segregation of public facilities and social events against its population. While this can help our government solidify its power, this can draw international backlash."
 ni_4: "Cognoscenti"
 ni_4_desc: "A shadow government controls our state, with our civilian population knowing nothing about its existance continue to live under the impression of a democratic state. Keeping up the masquerade of our existance is expensive, but we must secure the state against the uneducated masses.\n\n§RShould this mask crack and the public knowing of our existance, a crisis may occur..."
 ni_5: "Oligarchical Collectivism"
 ni_5_desc: "All property, media, and government civil service is owned by a small group - rather than individual Party members. \nEverything for the State. Nothing outside the State. Nothing against the State.\n\n§RWAR IS PEACE\nFREEDOM IS SLAVERY\nIGNORANCE IS STRENGTH!"
 ni_6: "Great Firewall"
 ni_6_desc: "In the age of the internet, we must protect our citizens from harmful information online and ensure widespread surveillance. While combatting VPNs remains a challange, keeping an eye on our citizens online conduct is needed to prevent antisocial behaviour."
 ni_7: "Surveillance State"
 ni_7_desc: "We cannot be caugh underprepared. Extensive surveillance is done across the state - cameras are seen everywhere and police patrol the streets regardless of privacy concerns from citizens. While this ensures we can root out crimes, corruption, and espionage with ease, this strokes civilian discontent. Few people enjoy knowing they are being watched, but few can deny they don't feel safer."
 ni_8: "Targeted Poverty Alleviation"
 ni_8_desc: "The government, aiming to address poverty across the country, diverts funds to addressing wealth inequality and poor social situations. From state run hospitals to soup hotels, the state will nobody is left behind." 
 ni_9: "State Directed Education"
 ni_9_desc: "The state has ensured that all of its people are properly educated and has taken the reins of education into its own hands. State directed literacy and higher education campaigns are compulsory for all children, ensuring that an education population free and available for everyone.\n\nHowever, an education population is also a volatile one..."
 ni_10: "Privatized Education"
 ni_10_desc: "The state has outsourced its education to the private sector. While cutting costs in education, children's learning being entirely outsoursed means children grow up often learning mearly what is cheap to learn rather than what is needed for life. Parents often opt to not send their children to school and those who can afford it simply send their children abrod to learn.\n\nHowever, an uneducated population is also a pacified one..."
 ni_11: "Patriotic Agitprop"
 ni_11_desc: "Our country has a proud history and thus the government leans on heavily to garner civilian support."

 #national ideas 2 
 ni_21: "Public Sector Dominance"
 ni_21_desc: "The public sector makes up most of our GDP, with extensive spending from the government and state intervention behind most economic decisions. The public sector provides the government heavy levels of control over the economy and allows for heavy levels of state planning."
 ni_22: "Iron Bowl"
 ni_22_desc: "Government efforts and extensive public spending have ensured a widespead provision of job security. All citizens enjoy employment in state owned enterprises, ensuring that all citizens have are able to find work."
 ni_23: "Laissez-faire"
 ni_23_desc: "Government intervention in the economy is kept at a minimum. While completely devastating any hope of central government planning - and leaving heavy civilian resentment - this allows the government a large amount of income."
 ni_24: "Trust Busting"
 ni_24_desc: "In order to prevent trusts and firms from gaining too much power and ruining competition, the government regulates the size and scale in which corporations can operate in. While preventing large scale economic growth, it prevents capital from accumulating massively and protects locial buinesses."
 ni_25: "Centrally Planned Economy"
 ni_25_desc: "The state directs economic planning through state owned corporations that have a total monopoly over the economy with the government exerting heavy control over the economy seting its own directives through several year plans. Controlling what goes where and when, allows the government to control or even abolish inflation. However, this can make competition lackluster."
 ni_26: "Tourist Sector"
 ni_26_desc: "A strong tourist sector brings in foreign international currencies with minimal soft power at no industrial cost."
 ni_27: "Illicit Businesses"
 ni_27_desc: "Illicit Businesses centers around bringing less than legitimate - or even legal - foreign capital.\nCartels, mobs, and other organized crime syndicates are everywhere and often engage in scamming, blackmail, drug manufacturing, or other criminal enterpise.\n\nCollaborating with these under-the-table wire transactions may turn the stomach, but can provide some very much needed capital for our budget, but at a severe cost to government efforts to curb corruption...\n\n§R"Capitalists believe they can take everything at the table as belonging to them. Capitalism is the legitimate racket of the ruling class."§!\n§R-Al Capone§!"
 ni_28: "Songun"
 ni_28_desc: "Our policy of 'military first', or 'Songun' ensures that our army gets all the munitions needed. This economic policy, more often than not adopted as a necessity for self defense, helps safeguard our nation from imperalist aggression at a massive civilian cost."
 ni_29: "Industrial Innovation"
 ni_29_desc: "Government subsidies and state directed efforts to modernize our industrial base, increase automation, and either reverse de-industrialization or spur it. However, this can harm other sectors of the economy as the priority placed on industry can leave our economy undiversified."
 ni_30: "Agriculture Modernization"
 ni_30_desc: "Government subsidies and state directed efforts to assist with our primary sector are underway. However, this extensive focus on agriculture can harm other sectors of the economy such as industry."
 ni_31: "Service Sector Development"
 ni_31_desc: "With an industrial economy already past us, there's no reason to maintain any capacity to manufacture domestic products when international ones are much cheaper. Instead, efforts are placed to focus on a service sector. Though downsizing our industry and reinvesting in a service based economy may have adverse affects..."
 
 # national ideas 3
 ni_40: "Military Parades"
 ni_40_desc: "We can show off our armed forces without actually using them."
 ni_41: "Mass Production"
 ni_41_desc: "To ensure we can produce enough munitions for the armed forces, we have increased factory hours and military spending to up production to mobalize. However, long term, the increased hours and stress on our economy can cause popular unrest."
 ni_42: "Strike a Blow!"
 ni_42_desc: "Ballistic missiles make up the blunt of our airforce. Cheap to make, they can overwhelm air defenses with their sheer numbers. Let our enemies tremble as we strike a blow at their defenses!"
 ni_43: "Party Commands the Gun"
 ni_43_desc: "Our armed forces are loyal to the communist party first and formost. With an army hard as steel protecting our socialist motherland from imperalist aggression that we are surrounded with, we must make sure it is loyal to the state they are assigned with defending. Political commissars and conscription ensures that our army is fit to protect our socialist republic."
 ni_44: "The Masters of War"
 ni_44_desc: "We are the masters of war, and today, like yesterday, our people fight like heros! Let the historical feats of old inspire us to achieve the next ones!"
 ni_45: "Military Construction Brigades"
 ni_45_desc: "Our military carries out duties in war time, but during peacetime are mobilized for domestic construction projects such roads while also assisting in disaster and crisis relief."
 ni_46: "Aircraft Investment"
 ni_46_desc: "I'm out of fucking ideas on what to add as locialization. I cramped my hand writing this shit. pretend there's some witty loc here or something."


# DEVELOPMENT
 academic_development: "Academic Development"
 academic_development_modifier_tooltip: "------------\nAcademic Development: [?academic_development_var|+1%]\nMonthly Academic Development: [?modifier@academic_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference (no GFX_development sprite exists anywhere in this mod or base game; was logging "Couldnt find texticon: development" on every tooltip render)
 lower_academic: "Cognitive Struggle"
 lower_academic_desc: "At this level, a significant portion of the population faces challenges in accessing and acquiring basic education. Mass illiteracy is prevalent, and individuals may struggle with fundamental cognitive skills. This stage is characterized by limited exposure to formal learning and knowledge acquisition."
 low_academic: "Basic Literacy Attainment"
 low_academic_desc: "Efforts are made to address mass illiteracy, resulting in a stage where a broader segment of the population gains basic literacy and numeracy skills. While cognitive abilities improve, there is still a focus on foundational knowledge, and individuals may have limited exposure to more advanced intellectual pursuits."
 medium_academic: "Functional Competence"
 medium_academic_desc: "The society reaches a stage where a majority of individuals achieve functional competence in various cognitive domains. Basic education is widespread, and people can effectively apply their knowledge to navigate daily challenges. This level involves a more practical understanding of concepts and problem-solving skills."
 high_academic: "Critical Thinkers"
 high_academic_desc: "Advancing beyond functional competence, individuals in this stage develop critical thinking skills. Education encourages analytical reasoning, independent thought, and a deeper understanding of complex concepts. The society places value on intellectual curiosity and encourages individuals to question, analyze, and synthesize information."
 higher_academic: "Intellectual Excellence"
 higher_academic_desc: "This represents the highest level of intellectual development in a society. Individuals at this stage are not only well-educated but also pursue intellectual excellence. There is a strong emphasis on advanced education and research. The society values innovation, embraces a culture of continuous learning, and fosters an environment where intellectual achievements are celebrated."
 higher_academic_tooltip: "§GWe will have Modern Academic Development!§!"
 highest_academic: "Academic Ingenuity"
 highest_academic_desc: ""
 
 
 farming_development: "Agricultural Development"
 farming_development_modifier_tooltip: "------------\nAgricultural Development: [?farming_development_var|+1%]\nMonthly Agricultural Development: [?modifier@farming_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference
 lower_farming: "Subsistence Farming"
 lower_farming_desc: "In this stage, the society primarily relies on subsistence farming, with limited agricultural productivity. Access to food is a constant challenge, and communities struggle to meet basic nutritional needs. Agricultural practices are often traditional and inefficient."
 low_farming: "Basic Food Security"
 low_farming_desc: "The society achieves a level of basic food security with improved agricultural practices. Farming methods are enhanced, and there is a modest increase in productivity. However, access to a varied and nutritious diet may still be limited, and communities may face occasional food shortages."
 medium_farming: "Sustainable Food Production"
 medium_farming_desc: "The society transitions to more sustainable agricultural practices, emphasizing soil conservation, water management, and crop rotation. This level signifies a more stable and reliable food supply. Communities can meet their nutritional needs consistently, reducing the vulnerability to periodic food shortages."
 high_farming: "Diversified Agricultural Prosperity"
 high_farming_desc: "Agriculture becomes a source of prosperity, with a diverse range of crops and livestock. Advanced farming techniques, technology adoption, and agricultural diversification lead to increased productivity and economic well-being. This stage represents a society with ample access to a variety of nutritious foods, contributing to overall health and well-being."
 higher_farming: "Modernized Agriculture"
 higher_farming_desc: ""
 higher_farming_tooltip: "§GWe will have Modern Farming!§!"
 highest_farming: "Agro-Technological Advancement"
 highest_farming_desc: "This represents the highest level of agricultural development in a society. Advanced technologies, precision farming, and sustainable practices are integrated into the agricultural sector. The society not only achieves food self-sufficiency but also becomes a contributor to regional and global food security. Agricultural innovations and research play a crucial role in maintaining a resilient and productive food system."
 
 
 poverty_development: "Poverty Rate"
 poverty_development_modifier_tooltip: "------------\nPoverty Development: [?poverty_development_var|+1%]\nMonthly Poverty Development: [?modifier@poverty_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference
 lower_poverty: "Grinding Poverty"
 lower_poverty_desc: "This stage represents the lowest level of economic well-being, with a significant portion of the population experiencing grinding poverty. Average income is minimal, and many individuals struggle to meet basic needs such as food, shelter, and healthcare. Poverty is pervasive, hindering overall societal development."
 low_poverty: "Low End Development"
 low_poverty_desc: "At this level, the society faces widespread financial strain, with average incomes remaining insufficient to ensure a decent standard of living. Many individuals grapple with economic challenges, leading to limited access to education, healthcare, and essential services."
 medium_poverty: "Moderate Income Hardships"
 medium_poverty_desc: "This stage reflects a situation where the majority faces moderate income hardships. While some economic activities occur, average incomes are modest, and a significant proportion of the population experiences difficulties in maintaining a stable and satisfactory quality of life"
 high_poverty: "Growing Middle-Income Aspirations"
 high_poverty_desc: "The society witnesses a transition as middle-income aspirations begin to grow. Average incomes show improvement, providing a larger segment of the population with a more comfortable financial standing. However, disparities in income distribution may persist, affecting social equity."
 higher_poverty: "Sustained Prosperity and Development"
 higher_poverty_desc: "This represents the pinnacle of economic well-being, characterized by sustained prosperity and economic wellness. Average incomes reach levels that allow the majority of the population to enjoy a high quality of life. Opportunities for education, healthcare, and overall well-being are widely accessible, contributing to a thriving and equitable society."
 higher_poverty_tooltip: "§GWe will rid of Poverty!§!"
 highest_poverty: "Near-Eradicated Scarcity and Poverty"
 highest_poverty_desc: "We have achieved a post scarcity economy!"


 industry_development: "Industrial Development"
 industrial_development_modifier_tooltip: "------------\nIndustrial Development: [?industrial_development_var|+1%]\nMonthly Industrial Development: [?modifier@industrial_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference
 lower_industry: "Meger Industrial Base"
 lower_industry_desc: "Either through offshoering or never having one in the first place, industry is significantly weaker than what more industrialized countries can muster. While this comes with the chance to develop an advanced service sector, the lack of an industrial base means we are reliant on other countries for products."
 low_industry: "Light Industry"
 low_industry_desc: "In this stage, workshops and small industries adopt simple machines, improving efficiency and output, however they mostly produce light commodies. We lack the major industry to produce heavy equipment and we are still reliant on foreign markets"
 medium_industry: "Intermediate Manufacturing"
 medium_industry_desc: "Heavier industry is more commonplace, with efforts to produce heavier industrial output without harming the civilian sector."
 high_industry: "Complex Industry"
 high_industry_desc: "Our industrial base is something to be praised. We can manufacture many things within our own borders. However, if we rely too much on our production of heavy industry, our civilian sector can suffer."
 higher_industry: "Industrial Powerhouse"
 higher_industry_desc: "Our industrial base makes us a powerful state in the international market, but our overreliance on heavy industry means that civilian markets are beginning to feel the pinch of the needs of our heavy industrial base."
 higher_industry_tooltip: "§GWe will have Modern Industrial Development!§!"
 highest_industry: "Massive Industrial Base"
 highest_industry_desc: "Our country can produce hydroelectic dams, send people to space, and manufacture massive amounts of military equipment, but we struggle to produce basic consumer goods due to our overreliance on heavy industry."


 military_development: "Military Professionality"
 military_development_modifier_tooltip: "------------\nMilitary Professionality: [?military_development_var|+1%].\nMonthly Military Professionality: [?modifier@military_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference
 lower_military: "Unorganized Rabble"
 lower_military_desc: "This level represents a lack of structure, discipline, and professionalism within the military force. Units or individuals at this stage may exhibit disorganization, a lack of training, and minimal adherence to established protocols."
 low_military: "Novice Formation"
 low_military_desc: "At this stage, the military force begins to take shape, with an emphasis on basic training and initial formation. Novice units focus on instilling discipline, basic tactics, and adherence to military protocols. However, they may still lack the experience and proficiency seen in more advanced stages."
 medium_military: "Competent Cohort"
 medium_military_desc: "The military force reaches a level of competence, demonstrating proficiency in core skills, tactical understanding, and adherence to established standards. Units or individuals at this stage exhibit a higher degree of professionalism, with a focus on teamwork, effective communication, and mastery of essential military tasks."
 high_military: "Expert Brigade"
 high_military_desc: "At this level, the military force has achieved a high degree of expertise and specialization. Units within the force are capable of executing complex operations with precision, displaying advanced tactical proficiency, and maintaining a high level of professionalism. Continuous training, education, and adaptability are emphasized to stay ahead of evolving challenges."
 higher_military: "Elite Vanguard"
 higher_military_desc: "The pinnacle of military professional development, where the force is considered elite and excels in all aspects. This level involves mastery of not only conventional warfare but also proficiency in specialized operations such as special forces, cyber warfare, and intelligence. The military force at this stage is recognized for its exceptional discipline, strategic thinking, adaptability, and professionalism on a global scale."
 higher_military_tooltip: "§GWe will have Modern Military Development!§!"
 highest_military: "Advanced Warfare Tactics"
 highest_military_desc: ""


 society_development: "Societal Development"
 society_development_modifier_tooltip: "------------\nSociety Development: [?society_development_var|+1%]\nMonthly Society Development: [?modifier@society_development_monthly|=+1%]" # CKEdited - removed broken £development texticon reference
 lower_society: "Anarchic"
 lower_society_tt: "£economy_laws_cost_texticon  Laws Cost: §R+20%§!"
 lower_society_desc: "At this level of development, social order is non existant and development is hardly an afterthought."
 low_society: "Meger Development"
 low_society_tt: "£economy_laws_cost_texticon  Laws Cost: §R+15%§!"
 low_society_desc: "Governance is compromised because of our instability, or instability exists because of our compromised government. This level of development is unstable and typical across much of the global south."
 medium_society: "Stable Development"
 medium_society_tt: "£economy_laws_cost_texticon  Laws Cost: §R+10%§!"
 medium_society_desc: "In this stage, economic, cultural, and civil development begin to manifest themselves. The economy is stable and slowly growing."
 law_high_society: "Advancing Development"
 law_high_society_tt: "£economy_laws_cost_texticon  Laws Cost: §R+5%§!"
 law_high_society_desc: "Efforts to modernize have seen results. Our state has reached a living standard slightly above much of the global south, but increasing wealth inequality and social tensions may manifest themselves."
 higher_society: "Modern Society"
 higher_society_desc: "We are a modern society and we enjoy a living standard equal to that of the first world! However, wealth inequality, lower birthrates, and other more abstract social problems begin to crop up."
 higher_society_tooltip: "§GWe will have a Modern Society!§!"
 highest_society: "Pinnacle of Civilization"
 highest_society_desc: "Representing the highest level of civilization, this stage is marked by advanced technology, robust institutions, cultural richness, and a high standard of living. The society becomes a global leader in various fields, contributing to advancements in science, arts, and governance. The focus extends beyond economic prosperity to sustainable development, social justice, and a harmonious coexistence with the environment."

