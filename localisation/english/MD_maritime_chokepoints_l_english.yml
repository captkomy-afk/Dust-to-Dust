 ### TURKISH STRAITS DECISIONS (Bosphorus + Dardanelles, treated as one Black Sea chokepoint) ###
 MD_turkish_straits_close: "Close the Turkish Straits"
 MD_turkish_straits_close_desc: "We can close the Bosphorus and the Dardanelles to all foreign shipping, sealing off the Black Sea from the Mediterranean. Every nation that relied on the straits will lose that route entirely, at real cost to their economies - and to our own standing in the world."
 MD_turkish_straits_closed_tt: "The Turkish Straits are now closed to all foreign shipping. Every other nation suffers a trade disruption penalty until they reopen."
 MD_turkish_straits_reopen: "Reopen the Turkish Straits"
 MD_turkish_straits_reopen_desc: "The Bosphorus and the Dardanelles can be reopened to international shipping, lifting the closure and any blockades we have placed on individual nations."
 MD_turkish_straits_reopened_tt: "The Turkish Straits are open again. All blockades and the general closure have been lifted."

