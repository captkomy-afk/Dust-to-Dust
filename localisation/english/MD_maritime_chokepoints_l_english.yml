 ### SUEZ CANAL DECISIONS ###
 MD_suez_close_canal: "Close the Suez Canal"
 MD_suez_close_canal_desc: "We can close the Suez Canal to all foreign shipping, cutting the link between the Mediterranean and the Red Sea. Every nation that relied on the canal will be forced to reroute around Africa, at real cost to their economies - and to our own standing in the world."
 MD_suez_closed_tt: "The Suez Canal is now closed to all foreign shipping. Every other nation suffers a trade disruption penalty until it reopens."
 MD_suez_reopen_canal: "Reopen the Suez Canal"
 MD_suez_reopen_canal_desc: "The Suez Canal can be reopened to international shipping, lifting the closure and any blockades we have placed on individual nations."
 MD_suez_reopened_tt: "The Suez Canal is open again. All blockades and the general closure have been lifted."
 MD_suez_raise_tolls: "Raise Suez Canal Tolls"
 MD_suez_raise_tolls_desc: "We can raise transit fees on the Suez Canal again. Each increase compounds our toll revenue further, but we bear the cost ourselves: rising domestic prices and cooling trade relations."
 MD_suez_tolls_raised_tt: "Suez Canal tolls have been raised again. Our toll revenue is up, but domestic consumer prices have risen and trade partners think less of us."
 MD_suez_lower_tolls: "Lower Suez Canal Tolls"
 MD_suez_lower_tolls_desc: "We can lower transit fees on the Suez Canal again, down to a floor of free passage. Each cut reduces our toll revenue, but eases domestic prices and improves trade relations."
 MD_suez_tolls_lowered_tt: "Suez Canal tolls have been lowered again. Our toll revenue is down, but domestic consumer prices have eased and trade partners appreciate the savings."
 MD_suez_restore_standard_tolls: "Restore Standard Suez Canal Tolls"
 MD_suez_restore_standard_tolls_desc: "We can return the Suez Canal's tolls to their standard, GDP-indexed rate, ending whatever surcharge or discount is currently in effect and clearing any penalty it carried."
 MD_suez_tolls_restored_tt: "Suez Canal tolls have returned to their standard, GDP-indexed rate. No surcharge or discount is currently in effect."

