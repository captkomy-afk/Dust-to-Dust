 ### SUEZ - DIPLOMATIC ACTIONS ###
 MD_SUEZ_BLOCK_IMPOSE_TITLE: "Restrict from the Suez Canal"
 MD_SUEZ_BLOCK_IMPOSE_ACTION_DESC: "We can deny this nation passage through the Suez Canal. Their ships will have to reroute around Africa, and they will gain the right to make war on us over the canal."
 MD_SUEZ_BLOCK_IMPOSE_SEND: "We will deny this nation all passage through the Suez Canal. Their shipping will have to take the long way around Africa, their trade will suffer, and they will gain a claim to make war on us over the canal."
 MD_SUEZ_BLOCK_IMPOSE_ACCEPT: "Restricted from the Suez Canal!"
 MD_SUEZ_BLOCK_IMPOSE_ACCEPT_DESC: "We have been denied passage through the Suez Canal!"
 MD_SUEZ_BLOCK_LIFT_TITLE: "Lift Suez Canal Restriction"
 MD_SUEZ_BLOCK_LIFT_ACTION_DESC: "We can lift our restriction on this nation's use of the Suez Canal."
 MD_SUEZ_BLOCK_LIFT_SEND: "We will lift our restriction and allow this nation to use the Suez Canal again."
 MD_SUEZ_BLOCK_LIFT_ACCEPT: "Suez Canal Restriction Lifted!"
 MD_SUEZ_BLOCK_LIFT_ACCEPT_DESC: "Our restriction of the Suez Canal against this nation has been lifted."

