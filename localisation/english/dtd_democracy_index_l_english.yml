l_english:
 
 DEMOCRACY_INDEX_TOOLTIP: "§HDemocracy Index§! represents how "free" our country is considered on the international community. A higher value increases benefits from interacting with foreign countries while also making it harder to maintain stability back at home and keep foreign influence out.\n\nAs our legal system adjusts to democratic norms, our §HDemocracy Index§! will tick towards its equilibrium value at a rate of §G[?democracy_index_value_rate|.2]§! per week.\n\nCurrent §HDemocracy Index§! Equilibrium: §H[?democracy_index_value_eq]§!\nCurrent §HDemocracy Index§! Level: §H[?democracy_index_value]§!\n\n[GET_DEMOCRACY_INDEX_LEVEL]\n\nWe gain the following effects from our level of §HDemocracy Index§!:\n£political_power_texticon  Political Power Gain: [?dtd_democracy_index_political_power|+]\n£stability_texticon  Stability: [?dtd_democracy_index_stability|=%+]\n£war_support_modifiericons_texticon  War Support: [?dtd_democracy_index_war_support|=%+]\n£research_speed_texticon  Research Speed: [?dtd_democracy_index_research_speed|%+]\n£drift_defence_texticon  Ideology Drift Defense: [?dtd_democracy_index_drift_defence|=%+]\n£western_outlook_campaign_cost_modifier_texticon Daily Pro-Western Support: [?dtd_democracy_index_democratic_drift|=+]\n£emerging_outlook_campaign_cost_modifier_texticon Daily Emerging Support: [?dtd_democracy_index_communism_drift|=+]\n£nationalist_outlook_campaign_cost_modifier_texticon Daily Nationalist Support: [?dtd_democracy_index_nationalist_drift|=+]\n£improve_relations_cost_texticon  Improve Relations Maintain Cost: [?dtd_democracy_index_relations_cost|%+]\n£corruption_cost_factor_texticon  Cost to change Corruption: [?dtd_democracy_index_corruption_cost|=-%]"
 
 DEMOCRACY_INDEX_LEVEL_1: "This country is considered totalitarian by the international community, with total political isolation (either from force or of its own accords), this country will struggle making alliances internationally and struggles adapting to change, but the autocratic party line allows for a much faster decision making process."
 DEMOCRACY_INDEX_LEVEL_2: "This country is considered authoritarian by the global community, with moderate to severe levels of restriction on its press and media. It still engages with the international community with nothing more than a raised eyebrow and with a streamlined political process can have a mildly fast political decision making process."
 DEMOCRACY_INDEX_LEVEL_3: "This country, either through democratic backsliding by a crisis, popular will, or in transition, is considered a Hybrid Regime. With mild restrictions on its press, it enjoys the respect of a flawed democracy with the occasional repression of an authoritarian regime."
 DEMOCRACY_INDEX_LEVEL_4: "This country, either through democratic backsliding by a crisis, popular will, or in transition, is considered a Flawed Democracy. It has generally "free" press, but political violence and censorship are common from time to time. It is generally considered a democracy by international standards. Just be careful about publishing that article if you want to keep your job."
 DEMOCRACY_INDEX_LEVEL_5: "This country and its citizens enjoy a complete transparent democratic system. Free speech, press, and liberal institutions safeguard its democratic principles. Citizens enjoy unfounded political representation not often seen anywhere else."

