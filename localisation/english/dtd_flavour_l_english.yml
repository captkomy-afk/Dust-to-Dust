  # CPRF REWORK
 cprf.1.t: "CPRF Wins Elections"
 cprf.1.d: "In a monumental electoral event that will undoubtedly be etched in the annals of Russian history, the Communist Party of the Russian Federation has emerged victorious, sending ripples of jubilation through the streets of Moscow and other major urban centers. The sight of victory banners fluttering in the wind alongside Soviet flags was a poignant symbol of the resounding triumph that had been achieved.\n\nDespite the euphoria that engulfed the nation, there were dissenting voices that sought to cast a shadow of doubt over the legitimacy of the election results. Allegations of fraud and unfounded conspiracy theories were concocted in an attempt to undermine the significance of the Communist Party's win. The Western press, ever quick to sound alarms and raise specters of fear, painted a picture of the Communist Party as a bastion of nationalists and revanchists, intent on restoring the USSR and posing a grave threat to Western imperialism.\nHowever, amidst the cacophony of skepticism and fear-mongering, one undeniable truth remained: the people had spoken. Through their votes, they had expressed a fervent desire for the resurgence of the glorious Union that once stood as a beacon of hope and strength."
 cprf.1.a: "Communists, Forwards!"

 cprf.2.t: "[SOV.getleader] Restores the RSFSR"
 cprf.2.d: "Despite the death of the Union in 1991, it seems like a spectre, the Union has risen from the dead. Today the newly elected president [SOV.getleader], by approving a law renaming the country, have declared the end of the Russian Federation, and the rebirth of the Russian Soviet Federative Socialist Republic.\n\nAnnounced in front of a domestic crowd, the anthem of the Soviet Union was aired for the first time in over three decades, sung in tandemn with crowds throughout the streets. Although the domestic attitude is jubiliant with a hopeful return to superpower status and the glory of the old Union, the international community has been mixed. Reactions from the former Eastern Bloc has been the harshest, with the Baltic nations warning against repeating the mistakes of the 20th century, and Ukraine denouncing the move."
 cprf.2.a: "All Power to the Soviets!"

 cprf.3.t: "Rejoin the U.S.S.R.?"
 cprf.3.d: "do we rejoin the ussr or are we cringe?"
 cprf.3.a: "No"
 cprf.3.b: "Yes"